<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --border:#e2e8f0; --text:#1e293b;
    --muted:#64748b; --primary:#2563eb; --primary-dark:#1d4ed8;
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
  .brand h1{font-size:16px;margin:0}
  .brand small{color:var(--muted);display:block}
  .user-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#dbeafe;color:#1e40af;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer}
  .user-badge:hover{background:#bfdbfe}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .tab.hidden-tab{display:none}
  .tab.hidden-tab.revealed{display:inline-block}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:20px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
  .btn{padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-dark)}
  .btn.danger{color:var(--red);border-color:#fecaca}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn:hover{opacity:.92}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:#f8fafc;font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;top:0}
  tr:hover td{background:#f8fafc}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .total-row td{font-weight:700;background:#eff6ff;border-top:2px solid var(--primary)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.ongoing{background:#fef3c7;color:#92400e}
  .pill.completed{background:#dcfce7;color:#166534}
  .pill.pending{background:#fee2e2;color:#991b1b}
  .pill.new{background:#dbeafe;color:#1e40af}
  .pill.routine{background:#f1f5f9;color:#475569}
  .pill.add{background:#dcfce7;color:#166534}
  .pill.edit{background:#dbeafe;color:#1e40af}
  .pill.delete{background:#fee2e2;color:#991b1b}
  .actions{display:flex;gap:4px}
  .icon-btn{border:none;background:transparent;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}
  .icon-btn:hover{background:#f1f5f9}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:100;padding:16px}
  .modal-backdrop[hidden]{display:none !important}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-head h2{margin:0;font-size:16px}
  .modal-body{padding:16px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-body .full{grid-column:1/-1}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:360px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .val{font-size:22px;font-weight:700;margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .hint code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:11px}

  .net-status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;transition:all .3s;border:1px solid transparent;white-space:nowrap}
  .net-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(0,0,0,.04);animation:pulse 2s infinite}
  .net-status.online{background:#dcfce7;color:#166534;border-color:#86efac}
  .net-status.offline{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
  .net-status.syncing{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
  .net-status.pending{background:#fef3c7;color:#92400e;border-color:#fcd34d}
  .net-status.realtime{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .save-indicator{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-left:6px}
  .save-indicator.saved{background:#dcfce7;color:#166534}
  .save-indicator.saving{background:#dbeafe;color:#1e40af}
  .save-indicator.error{background:#fee2e2;color:#991b1b}
  .save-indicator.pending{background:#fef3c7;color:#92400e}

  .unlock-badge{position:fixed;bottom:20px;left:20px;background:#dcfce7;color:#166534;border:1px solid #86efac;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;z-index:150;display:none;animation:slideIn 0.3s ease}
  .unlock-badge.show{display:inline-flex;align-items:center;gap:6px}
  @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

  /* USER LOGIN MODAL */
  .user-modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.75);display:grid;place-items:center;z-index:300;padding:16px;backdrop-filter:blur(4px)}
  .user-modal-backdrop[hidden]{display:none !important}
  .user-modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:32px 28px;box-shadow:0 25px 60px rgba(0,0,0,.4);text-align:center}
  .user-modal .icon-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 16px}
  .user-modal h2{margin:0 0 24px;font-size:22px;font-weight:700}
  .user-modal .field{text-align:left;margin-bottom:16px}
  .user-modal .field label{display:block;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:600}
  .user-modal .field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#f8fafc}
  .user-modal .field input:focus{outline:2px solid #bfdbfe;border-color:var(--primary);background:#fff}
  .user-modal .field input::placeholder{color:#94a3b8}
  .user-modal .btn-continue{width:100%;padding:13px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
  .user-modal .btn-continue:hover{opacity:.92}
  .user-modal .error-msg{color:var(--red);font-size:12px;margin-top:6px;text-align:left;display:none}
  .user-modal .error-msg.show{display:block}

  @media(max-width:700px){.modal-body{grid-template-columns:1fr}th,td{font-size:12px}}
</style>
</head>

    <button class="tab" data-tab="reports">Reports &amp; Export</button>

  </nav>
</header>

<main id="view"><p class="empty">Loading…</p></main>

</div>

<div class="user-modal-backdrop" id="userModalBackdrop" hidden>

    <div class="icon-circle">👤</div>
    <h2>Welcome 👋</h2>
    <div class="field">
      <label for="inputUserName">Your Name *</label>
      <input type="text" id="inputUserName" placeholder="Enter your name" autocomplete="name" />
    </div>
    <div class="field">
      <label for="inputUserEmail">Your Email *</label>
      <input type="email" id="inputUserEmail" placeholder="Enter your email" autocomplete="email" />
    </div>
    <div class="error-msg" id="userError">Please fill both fields correctly.</div>
    <button class="btn-continue" id="btnContinue">Continue →</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">Edit</h2>
      <button class="icon-btn" id="modalClose" type="button">✕</button>
    </div>
    <form id="modalForm" class="modal-body" autocomplete="off"></form>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel" type="button">Cancel</button>
      <button class="btn primary" id="modalSave" type="button">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

function toast(msg, ms=2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.hidden = true; }, ms);
}

function getByPath(obj, path) { return path.reduce((o,k)=> (o ? o[k] : undefined), obj); }
function setByPath(obj, path, val) {
  const last = path[path.length-1];
  const parent = path.slice(0,-1).reduce((o,k)=> (o[k] = o[k] || {}), obj);
  parent[last] = val;
}
function fmtDate(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.toISOString().slice(0,10);
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/* ---------- CHANGE TRACKING ---------- */
function trackChange(action, tableKey, rowIndex, before, after) {
  if (!state.currentUser) return;
  if (!state.data.changeLog) state.data.changeLog = [];

  const cfg = TABLES[tableKey];
  const actionLabel = action === 'add' ? 'Added' : action === 'edit' ? 'Edited' : 'Deleted';

  let summary = '';
  if (action === 'add') {
    summary = `New row: ${after?.task || after?.taskName || after?.executive || '(no name)'}`;
  } else if (action === 'edit') {
    const changes = [];
    Object.keys(after || {}).forEach(k => {
      if (k === 'sno') return;
      const oldV = before?.[k] ?? '';
      const newV = after?.[k] ?? '';
      if (String(oldV) !== String(newV)) {
        changes.push(`${k}: "${oldV}" → "${newV}"`);
      }
    });
    summary = changes.length ? changes.join(' | ') : 'No field changes detected';
  } else if (action === 'delete') {
    summary = `Deleted row: ${before?.task || before?.taskName || before?.executive || '(no name)'}`;
  }

  const entry = {
    timestamp: nowStamp(),
    userName: state.currentUser.name,
    userEmail: state.currentUser.email,
    action: actionLabel,
    actionType: action,
    table: cfg?.title || tableKey,
    tableKey,
    rowIndex,
    summary,
    before: before ? JSON.stringify(before) : '',
    after: after ? JSON.stringify(after) : ''
  };

  state.data.changeLog.push(entry);
  if (state.data.changeLog.length > 5000) {
    state.data.changeLog = state.data.changeLog.slice(-5000);
  }
}

/* ---------- INDEXEDDB ---------- */
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}

/* ---------- FIREBASE ---------- */
async function initFirebase() {
  try {
    if (!firebaseConfig.databaseURL || firebaseConfig.databaseURL.includes('PASTE')) return false;
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    try {
      await firebase.auth().signInAnonymously();
      console.log('✅ Signed in anonymously');
    } catch(authErr) {
      console.error('❌ Anonymous auth failed:', authErr);
    }
    firebaseDb = firebase.database();
    firebaseRef = firebaseDb.ref('weeklyReport');
    firebaseEnabled = true;
    firebaseRef.on('value', (snapshot) => {
      const cloudData = snapshot.val();
      if (!cloudData) return;
      if (isRemoteUpdate) { isRemoteUpdate = false; return; }
      const cloudJson = JSON.stringify(cloudData);
      const localJson = JSON.stringify(state.data);
      if (cloudJson !== localJson) {
        state.data = cloudData;
        if (!state.data.changeLog) state.data.changeLog = [];
        localStorage.setItem(LS_KEY, JSON.stringify(state.data));
        render();
        toast('⚡ Real-time update from another system ✓');
        updateNetBadge('realtime');
        setTimeout(() => { if (isOnline) updateNetBadge('online'); }, 3000);
      }
    }, (error) => {
      console.error('Firebase listener error:', error);
      firebaseEnabled = false;
    });
    console.log('✅ Firebase real-time sync enabled');
    toast('⚡ Real-time sync active ✓');
    return true;
  } catch(e) {
    console.error('Firebase init failed:', e);
    firebaseEnabled = false;
    return false;
  }
}

async function syncToFirebase() {
  if (!firebaseEnabled || !firebaseRef) return false;
  if (!isOnline) return false;
  try {
    isRemoteUpdate = true;
    await firebaseRef.set(state.data);
    lastFirebaseUpdate = Date.now();
    return true;
  } catch(e) {
    console.error('Firebase sync failed:', e);
    isRemoteUpdate = false;
    return false;
  }
}

/* ---------- AUTO-SAVE ---------- */
let saveTimer = null;
let isSaving = false;

async function autoSave(reason) {
  clearTimeout(saveTimer);
  showSaveIndicator('saving', '💾 Saving…');
  saveTimer = setTimeout(async () => {
    if (isSaving) return;
    isSaving = true;
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state.data));
      if (state.dirHandle) {
        try {
          if (await ensurePerm(state.dirHandle)) {
            const fh = await state.dirHandle.getFileHandle(DATA_FILE, { create:true });
            const w = await fh.createWritable();
            await w.write(JSON.stringify(state.data, null, 2));
            await w.close();
          }
        } catch(e) { console.warn('OneDrive save failed:', e); }
      }
      if (firebaseEnabled) {
        if (isOnline) {
          const ok = await syncToFirebase();
          if (ok) { showSaveIndicator('saved', '✅ Real-time synced'); updateLastUpdated(); clearPendingSync(); }
          else { showSaveIndicator('error', '⚠️ Firebase failed'); markPendingSync(); }
        } else { showSaveIndicator('pending', '⏳ Offline'); markPendingSync(); updateLastUpdated(); }
      } else if (cloudConfig && cloudConfig.binId && cloudConfig.apiKey) {
        if (isOnline) {
          const ok = await syncToCloud();
          if (ok) { showSaveIndicator('saved', '✅ Saved'); updateLastUpdated(); clearPendingSync(); }
          else { showSaveIndicator('error', '⚠️ Cloud failed'); markPendingSync(); }
        } else { showSaveIndicator('pending', '⏳ Offline'); markPendingSync(); updateLastUpdated(); }
      } else {
        showSaveIndicator('saved', '✅ Saved');
        updateLastUpdated();
      }
    } catch(e) {
      console.error('Auto-save error:', e);
      showSaveIndicator('error', '⚠️ Error');
      markPendingSync();
    } finally { isSaving = false; }
  }, 1500);
}

/* ---------- INTERNET + JSONBIN ---------- */
let cloudConfig = JSON.parse(localStorage.getItem(CLOUD_KEY) || 'null');
let isOnline = false;
let isSyncing = false;
let lastCloudSync = localStorage.getItem('weeklyReportLastCloudSync');

async function checkRealInternet() {
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 4000);
    await fetch('https://www.google.com/generate_204', { method:'HEAD', mode:'no-cors', cache:'no-store', signal: controller.signal });
    clearTimeout(t);
    return true;
  } catch { return false; }
}

function updateNetBadge(s) {
  const el = document.getElementById('netStatus');
  if (!el) return;
  const lbl = el.querySelector('.label');
  el.classList.remove('online', 'offline', 'syncing', 'pending', 'realtime');
  if (s === 'online') {
    el.classList.add('online');
    lbl.textContent = firebaseEnabled ? 'Online • ⚡ Real-Time' : cloudConfig ? 'Online • Cloud On' : 'Online';
  } else if (s === 'offline') { el.classList.add('offline'); lbl.textContent = 'Offline'; }
  else if (s === 'syncing') { el.classList.add('syncing'); lbl.textContent = 'Syncing…'; }
  else if (s === 'pending') { el.classList.add('pending'); lbl.textContent = 'Pending sync…'; }
  else if (s === 'realtime') { el.classList.add('realtime'); lbl.textContent = '⚡ Real-time!'; }
}

async function refreshNetStatus() {
  if (isSyncing) { updateNetBadge('syncing'); return; }
  if (!navigator.onLine) { isOnline = false; updateNetBadge('offline'); return; }
  const real = await checkRealInternet();
  isOnline = real;
  if (real) {
    if (hasPendingSync() && cloudConfig && !firebaseEnabled) {
      updateNetBadge('syncing');
      const ok = await syncToCloud();
      if (ok) { clearPendingSync(); updateNetBadge('online'); }
      else updateNetBadge('pending');
    } else updateNetBadge('online');
  } else updateNetBadge('offline');
}

window.addEventListener('online', () => setTimeout(refreshNetStatus, 1000));
window.addEventListener('offline', refreshNetStatus);

async function syncToCloud() {
  if (!cloudConfig || !cloudConfig.binId || !cloudConfig.apiKey) return false;
  if (!isOnline || isSyncing) return false;
  isSyncing = true;
  updateNetBadge('syncing');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudConfig.apiKey, 'X-Bin-Versioning': 'false' },
      body: JSON.stringify(state.data)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastCloudSync = new Date().toISOString();
    localStorage.setItem('weeklyReportLastCloudSync', lastCloudSync);
    isSyncing = false;
    updateNetBadge('online');
    if (state.activeTab === 'cloud') render();
    return true;
  } catch (e) {
    console.error('Cloud sync error:', e);
    isSyncing = false;
    if (isOnline) updateNetBadge('online');
    return false;
  }
}

async function loadFromCloud(silent) {
  if (!cloudConfig || !cloudConfig.binId || !cloudConfig.apiKey) {
    if (!silent) toast('Configure cloud first');
    return false;
  }
  if (!isOnline) { if (!silent) toast('Offline'); return false; }
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudConfig.binId}/latest`, {
      headers: { 'X-Master-Key': cloudConfig.apiKey }
    });
    if (!res.ok) throw new Error('Load failed');
    const json = await res.json();
    if (json.record && json.record.summary) {
      if (!silent && !confirm('Replace current data with cloud data?')) return false;
      state.data = json.record;
      if (!state.data.changeLog) state.data.changeLog = [];
      localStorage.setItem(LS_KEY, JSON.stringify(state.data));
      render();
      if (!silent) toast('☁️ Loaded from cloud ✓');
      return true;
    } else {
      if (!silent) toast('Cloud is empty');
      return false;
    }
  } catch (e) {
    console.error(e);
    if (!silent) toast('Cloud load failed');
    return false;
  }
}

/* ---------- INIT ---------- */
async function init() {
  const raw = localStorage.getItem(LS_KEY);
  state.data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!state.data.changeLog) state.data.changeLog = [];

  if ('showDirectoryPicker' in window) {
    try {
      const handle = await idbGet('dirHandle');
      if (handle) { state.dirHandle = handle; try { await loadFromFolder(); } catch(e) {} }
    } catch(e) {}
  }

  if (!state.data) state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  if (!state.data.changeLog) state.data.changeLog = [];

  render();
  updateLastUpdated();
  await initFirebase();
  await refreshNetStatus();
  showUserModal(false);

  setInterval(refreshNetStatus, 30000);
  setInterval(async () => {
    if (hasPendingSync() && isOnline && !firebaseEnabled && cloudConfig) {
      const ok = await syncToCloud();
      if (ok) { clearPendingSync(); showSaveIndicator('saved', '✅ Synced'); }
    }
  }, 60000);

  window.addEventListener('beforeunload', (e) => {
    localStorage.setItem(LS_KEY, JSON.stringify(state.data));
    if (hasPendingSync()) { e.preventDefault(); e.returnValue = 'You have unsaved changes. Are you sure?'; }
  });
}

/* ---------- ONEDRIVE ---------- */
async function pickFolder() {
  if (!('showDirectoryPicker' in window)) { toast('Not supported.'); return; }
  try {
    const handle = await window.showDirectoryPicker({ mode:'readwrite' });
    state.dirHandle = handle;
    await idbSet('dirHandle', handle);
    await loadFromFolder();
    toast('OneDrive connected ✓');
    render();
  } catch(e) {}
}
async function ensurePerm(handle) {
  if (!handle) return false;
  const opts = { mode:'readwrite' };
  if (await handle.queryPermission(opts) === 'granted') return true;
  if (await handle.requestPermission(opts) === 'granted') return true;
  return false;
}
async function loadFromFolder() {
  if (!state.dirHandle) return;
  if (!(await ensurePerm(state.dirHandle))) return;
  try {
    const fh = await state.dirHandle.getFileHandle(DATA_FILE);
    const file = await fh.getFile();
    const text = await file.text();
    state.data = JSON.parse(text);
    if (!state.data.changeLog) state.data.changeLog = [];
  } catch (e) { await autoSave(); }
}

function updateLastUpdated() {

}

function renderTable(key) {
  const cfg = TABLES[key];
  const rows = getByPath(state.data, cfg.path) || [];
  const cols = cfg.columns;
  const search = (state.search[key] || '').toLowerCase();
  const filter = state.filterStatus[key] || '';

  const filtered = rows.filter(r => {
    if (filter && r.status !== filter) return false;
    if (!search) return true;
    return cols.some(c => String(r[c.key] ?? '').toLowerCase().includes(search));
  });

  const totals = {};
  if (cfg.totals) {
    cfg.totals.forEach(k => {
      totals[k] = filtered.reduce((s,r) => s + (Number(r[k]) || 0), 0);
    });
  }

  const statusPill = (v) => {
    if (!v) return '';
    const cls = /ongoing|on going/i.test(v) ? 'ongoing'
      : /completed/i.test(v) ? 'completed'
      : /pending/i.test(v) ? 'pending'
      : /new task/i.test(v) ? 'new'
      : /routine/i.test(v) ? 'routine' : '';
    return `<span class="pill ${cls}">${escapeHtml(v)}</span>`;
  };

  return `
    <div style="overflow:auto;max-height:65vh;border:1px solid var(--border);border-radius:10px">
      <table>
        <thead>
          <tr>
            ${cols.map(c => `<th style="${c.width?`width:${c.width}px`:''}">${escapeHtml(c.label)}</th>`).join('')}
            <th style="width:90px">Actions</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length === 0 ? `<tr><td colspan="${cols.length+1}" class="empty">No rows found</td></tr>` : ''}
          ${filtered.map((r) => {
            const realIndex = rows.indexOf(r);
            return `<tr>
              ${cols.map(c => {
                let val = r[c.key] ?? '';
                if (c.key === 'status' || c.key === 'type') return `<td>${statusPill(val)}</td>`;
                if (c.type === 'number') return `<td class="num">${val === '' ? '' : Number(val).toLocaleString()}</td>`;
                if (c.type === 'date') return `<td>${val ? fmtDate(val) : ''}</td>`;
                return `<td>${escapeHtml(val)}</td>`;
              }).join('')}
              <td class="actions">
                <button class="icon-btn" data-edit="${key}" data-index="${realIndex}" title="Edit">✏️</button>
                <button class="icon-btn" data-delete="${key}" data-index="${realIndex}" title="Delete">🗑️</button>
              </td>
            </tr>`;
          }).join('')}
          ${cfg.totals ? `
            <tr class="total-row">
              <td colspan="${cols.findIndex(c => c.key === cfg.totals[0])}">Total</td>
              ${cfg.totals.map((k,i) => `<td class="num">${totals[k].toLocaleString()}</td>`).join('')}
              <td colspan="${cols.length - cols.findIndex(c => c.key === cfg.totals[0]) - cfg.totals.length}"></td>
              <td></td>
            </tr>` : ''}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------- EVENTS ---------- */
function bindEvents() {
  $$('#tabs .tab').forEach(btn => {
    btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); };
  });

  $$('[data-search]').forEach(inp => {
    inp.oninput = () => {
      state.search[inp.dataset.search] = inp.value;
      render();
      const again = $(`[data-search="${inp.dataset.search}"]`);
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    };
  });

  $$('[data-filter]').forEach(sel => {
    sel.onchange = () => { state.filterStatus[sel.dataset.filter] = sel.value; render(); };
  });

  $$('[data-add]').forEach(btn => { btn.onclick = () => openModal(btn.dataset.add, null); });
  $$('[data-edit]').forEach(btn => { btn.onclick = () => openModal(btn.dataset.edit, Number(btn.dataset.index)); });
  $$('[data-delete]').forEach(btn => { btn.onclick = () => deleteRow(btn.dataset.delete, Number(btn.dataset.index)); });
  $$('[data-export-table]').forEach(btn => { btn.onclick = () => exportTableToExcel(btn.dataset.exportTable); });
  $$('[data-action]').forEach(btn => { btn.onclick = () => handleAction(btn.dataset.action); });

  const imp = $('#importFile');
  if (imp) {
    imp.onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          state.data = JSON.parse(reader.result);
          if (!state.data.changeLog) state.data.changeLog = [];
          await autoSave('import');
          render();
          toast('Imported ✓');
        } catch(err) { toast('Invalid JSON'); }
      };
      reader.readAsText(f);
    };
  }
}

async function handleAction(action) {
  if (action === 'pick-folder') return pickFolder();
  if (action === 'save-now') { await autoSave('manual'); toast('Saving…'); return; }
  if (action === 'export-full') return exportFullWorkbook();
  if (action === 'weekly-report') return generateWeeklyReport();
  if (action === 'export-json') return downloadJSON();
  if (action === 'import-json') { $('#importFile').click(); return; }
  if (action === 'save-email') {
    localStorage.setItem('weeklyReportEmail', $('#settingsEmail').value.trim());
    toast('Email saved ✓'); return;
  }
  if (action === 'send-email') return sendEmailFlow();
  if (action === 'change-user') {
    if (confirm('Change user? Current name & email will be replaced.')) showUserModal(true);
    return;
  }
  if (action === 'export-changelog') return exportChangeLog();
  if (action === 'clear-changelog') {
    if (!confirm('Clear ALL change log entries? This cannot be undone.')) return;
    state.data.changeLog = [];
    await autoSave('clear-changelog');
    render();
    toast('Change log cleared');
    return;
  }
  if (action === 'sync-now') {
    showSaveIndicator('saving', '💾 Syncing…');
    if (firebaseEnabled) {
      const ok = await syncToFirebase();
      if (ok) { showSaveIndicator('saved', '✅ Synced'); toast('⚡ Firebase synced ✓'); }
      else { showSaveIndicator('error', '⚠️ Failed'); toast('Firebase sync failed'); }
    } else {
      const ok = await syncToCloud();
      if (ok) { showSaveIndicator('saved', '✅ Synced'); clearPendingSync(); toast('☁️ Cloud synced ✓'); }
      else { showSaveIndicator('error', '⚠️ Failed'); toast('Cloud sync failed'); }
    }
    if (state.activeTab === 'cloud') render();
    return;
  }
  if (action === 'load-cloud') return loadFromCloud(false);
  if (action === 'unlink-cloud') {
    if (!confirm('Remove cloud configuration?')) return;
    cloudConfig = null;
    localStorage.removeItem(CLOUD_KEY);
    render();
    refreshNetStatus();
    toast('Cloud unlinked'); return;
  }
  if (action === 'save-cloud') {
    const binId = $('#cloudBinId').value.trim();
    const apiKey = $('#cloudApiKey').value.trim();
    if (!binId || !apiKey) { toast('Fill Bin ID and Master Key'); return; }
    cloudConfig = { binId, apiKey };
    localStorage.setItem(CLOUD_KEY, JSON.stringify(cloudConfig));
    toast('Cloud configured ✓');
    render();
    refreshNetStatus();
    return;
  }
  if (action === 'reset-data') {
    if (!confirm('Reset all data to default? Change log also cleared.')) return;
    state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    state.data.changeLog = [];
    await autoSave('reset');
    render();
    toast('Reset ✓');
    return;
  }
}

/* ---------- CRUD ---------- */
function openModal(tableKey, rowIndex) {
  const cfg = TABLES[tableKey];
  if (!cfg) { toast('Error: Table not found'); return; }
  const rows = getByPath(state.data, cfg.path) || [];
  const row = rowIndex === null ? {} : {...rows[rowIndex]};
  state.modal = { open:true, tableKey, rowIndex, mode: rowIndex === null ? 'add' : 'edit' };

  $('#modalTitle').textContent = (rowIndex === null ? 'Add' : 'Edit') + ' — ' + cfg.title;

  const form = $('#modalForm');
  form.innerHTML = cfg.columns.map(c => {
    if (c.readonly) return '';
    const val = row[c.key] ?? '';
    const id = 'f_' + c.key;
    if (c.type === 'select') {
      return `<div class="field">
        <label for="${id}">${escapeHtml(c.label)}</label>
        <select id="${id}" data-key="${c.key}">
          <option value="">—</option>
          ${c.options.map(o => `<option ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>`;
    }
    if (c.type === 'date') {
      return `<div class="field">
        <label for="${id}">${escapeHtml(c.label)}</label>
        <input type="date" id="${id}" data-key="${c.key}" value="${escapeHtml(val?fmtDate(val):'')}" />
      </div>`;
    }
    if (c.type === 'number') {
      return `<div class="field">
        <label for="${id}">${escapeHtml(c.label)}</label>
        <input type="number" min="${c.min??0}" id="${id}" data-key="${c.key}" value="${escapeHtml(val)}" />
      </div>`;
    }
    return `<div class="field">
      <label for="${id}">${escapeHtml(c.label)}</label>
      <input type="text" id="${id}" data-key="${c.key}" value="${escapeHtml(val)}" ${c.required?'required':''} />
    </div>`;
  }).join('');

  $('#modalBackdrop').hidden = false;
}

function closeModal() {
  $('#modalBackdrop').hidden = true;
  state.modal = { open:false, tableKey:null, rowIndex:null, mode:'add' };
}

async function saveModal() {
  const { tableKey, rowIndex, mode } = state.modal;
  const cfg = TABLES[tableKey];
  if (!cfg) return;
  const rows = getByPath(state.data, cfg.path) || [];

  const beforeRow = mode === 'edit' ? {...rows[rowIndex]} : null;
  const newRow = mode === 'edit' ? {...rows[rowIndex]} : {};
  const inputs = $$('#modalForm [data-key]');
  for (const inp of inputs) {
    const key = inp.dataset.key;
    const col = cfg.columns.find(c => c.key === key);
    if (!col) continue;
    let val = inp.value;
    if (col.required && !val.trim()) { toast('Please fill: ' + col.label); inp.focus(); return; }
    if (col.type === 'number') {
      if (val === '') val = '';
      else {
        const n = Number(val);
        if (isNaN(n) || n < 0) { toast('Invalid number: ' + col.label); inp.focus(); return; }
        val = n;
      }
    }
    newRow[key] = val;
  }

  if (mode === 'add') {
    if (cfg.columns.some(c => c.key === 'sno')) {
      newRow.sno = rows.length ? Math.max(...rows.map(r => Number(r.sno)||0)) + 1 : 1;
    }
    rows.push(newRow);
    trackChange('add', tableKey, rows.length - 1, null, newRow);
  } else {
    rows[rowIndex] = newRow;
    trackChange('edit', tableKey, rowIndex, beforeRow, newRow);
  }

  setByPath(state.data, cfg.path, rows);
  closeModal();
  render();
  toast('Saved ✓');
  await autoSave(mode);
}

async function deleteRow(tableKey, index) {
  const cfg = TABLES[tableKey];
  const rows = getByPath(state.data, cfg.path) || [];
  const deletedRow = {...rows[index]};
  if (!confirm(`Delete this row?\n\n${deletedRow?.task || deletedRow?.taskName || ''}`)) return;
  rows.splice(index, 1);
  if (cfg.columns.some(c => c.key === 'sno')) { rows.forEach((r,i) => r.sno = i+1); }
  setByPath(state.data, cfg.path, rows);
  trackChange('delete', tableKey, index, deletedRow, null);
  render();
  toast('Deleted ✓');
  await autoSave('delete');
}

  const wsSummary = XLSX.utils.aoa_to_sheet(buildSummarySheet());
  wsSummary['!cols'] = [{wch:6},{wch:45},{wch:12},{wch:20},{wch:14},{wch:14},{wch:28},{wch:20}];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  const wsM = XLSX.utils.aoa_to_sheet(buildMarketingSheet());
  wsM['!cols'] = [{wch:12},{wch:20},{wch:45},{wch:14},{wch:12},{wch:14},{wch:36},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsM, 'Marketing');

  const wsEA = XLSX.utils.aoa_to_sheet(buildEASheet());
  wsEA['!cols'] = [{wch:18},{wch:35},{wch:45},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsEA, 'EA');

  const wsLog = XLSX.utils.aoa_to_sheet(buildChangeLogSheet());
  wsLog['!cols'] = [{wch:20},{wch:18},{wch:28},{wch:10},{wch:28},{wch:60},{wch:50},{wch:50}];
  XLSX.utils.book_append_sheet(wb, wsLog, 'Change Log');

  return wb;
}

async function exportFullWorkbook() {
  const wb = buildWorkbook();
  XLSX.writeFile(wb, `Weekly_Report_Full_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel exported (with Change Log) ✓');
}

async function exportChangeLog() {
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(buildChangeLogSheet());
  ws['!cols'] = [{wch:20},{wch:18},{wch:28},{wch:10},{wch:28},{wch:60},{wch:50},{wch:50}];
  XLSX.utils.book_append_sheet(wb, ws, 'Change Log');
  XLSX.writeFile(wb, `ChangeLog_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Change Log exported ✓');
}

async function exportTableToExcel(key) {
  const cfg = TABLES[key];
  const rows = getByPath(state.data, cfg.path) || [];
  const aoa = [cfg.columns.map(c => c.label)];
  rows.forEach(r => aoa.push(cfg.columns.map(c => r[c.key] ?? '')));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), cfg.title.slice(0,30));
  XLSX.writeFile(wb, `${cfg.title.replace(/[^\w]+/g,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Table exported ✓');
}

async function generateWeeklyReport() {
  const wb = buildWorkbook();
  const fname = `Weekly_Report_${new Date().toISOString().slice(0,10)}.xlsx`;
  if (state.dirHandle) {
    try {
      const reportsDir = await state.dirHandle.getDirectoryHandle('WeeklyReports', { create:true });
      const fh = await reportsDir.getFileHandle(fname, { create:true });
      const w = await fh.createWritable();
      const data = XLSX.write(wb, { type:'array', bookType:'xlsx' });
      await w.write(data);
      await w.close();
      toast('Weekly report saved ✓');
      return;
    } catch(e) { console.error(e); }
  }
  XLSX.writeFile(wb, fname);
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `weekly_report_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function sendEmailFlow() {
  const to = $('#emailTo')?.value.trim() || localStorage.getItem('weeklyReportEmail') || '';
  if (!to) { toast('Enter recipient email'); return; }
  const wb = buildWorkbook();
  const fname = `Weekly_Report_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  const subject = encodeURIComponent('Weekly Report — ' + new Date().toISOString().slice(0,10));
  const body = encodeURIComponent(`Hi,\n\nPlease find the weekly report attached.\n\nRegards,\n${state.currentUser?.name || 'Weekly Report Manager'}`);
  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
  toast('Report downloaded. Attach it to the email.');
}

/* ---------- MODAL & USER ---------- */
$('#modalClose').onclick = closeModal;
$('#modalCancel').onclick = closeModal;
$('#modalSave').onclick = saveModal;
$('#modalBackdrop').onclick = (e) => { if (e.target.id === 'modalBackdrop') closeModal(); };

$('#btnContinue').onclick = confirmUser;
$('#inputUserName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#inputUserEmail').focus(); });
$('#inputUserEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmUser(); });
$('#userBadge').onclick = () => {
  if (confirm(`Current: ${state.currentUser?.name}\n\nChange user?`)) showUserModal(true);
};

/* ---------- START ---------- */
init();
</script>
